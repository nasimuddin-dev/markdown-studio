name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # Start-up JavaScript stays within its budget (scripts/check-startup-size.mjs).
      - run: npm run check:startup
      # THIRD_PARTY_NOTICES.md matches the dependencies (regenerate with npm run notices).
      - run: npm run notices -- --check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  epub:
    name: EPUB validation (EPUBCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y epubcheck
      # The EPUB export tests write sample books (plain, and one with everything) to EPUB_OUT.
      - run: npx vitest run tests/toEpub.test.ts
        env:
          EPUB_OUT: epub-samples
      - run: for f in epub-samples/*.epub; do echo "== $f"; epubcheck "$f" || exit 1; done

  latex:
    name: LaTeX export compiles (pdflatex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-plain-generic
      # The LaTeX export tests write sample documents (plain, and one with everything) to LATEX_OUT.
      - run: npx vitest run tests/toLatex.test.ts
        env:
          LATEX_OUT: latex-samples
      - run: cd latex-samples && for f in *.tex; do echo "== $f"; pdflatex -interaction=nonstopmode -halt-on-error "$f" > /dev/null || { tail -40 "${f%.tex}.log"; exit 1; }; done

  native-linux:
    name: Native app tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies, WebKitWebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo install tauri-driver --locked
      # The real app under a virtual display; the D-Bus session carries the single-instance hand-over.
      - run: dbus-run-session -- xvfb-run -a npm run test:native

  audit:
    name: Dependency audit (npm, cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Known vulnerabilities in what ships (dev tools aren't part of the app).
      - run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices for crates Tauri's Linux stack pulls in are printed, not fatal.
      - run: cargo audit --file src-tauri/Cargo.lock

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Create frontend dist placeholder
        run: mkdir -p dist && echo "<!doctype html>" > dist/index.html
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml
