[package]
name = "markpion"
version = "0.20.0"
description = "Cross-platform, local-first desktop Markdown editor"
authors = ["Markpion contributors"]
edition = "2021"
rust-version = "1.83"

[lib]
name = "markpion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
trash = "5"
base64 = "0.22"
regex = "1"
notify-debouncer-mini = "0.7"
# AI assistant: HTTPS to the Claude API (same reqwest/rustls build as the updater).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }

# The AI assistant's API key lives in the OS credential store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
