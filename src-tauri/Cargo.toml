[package]
name = "markpion"
version = "0.14.0"
description = "Cross-platform, local-first desktop Markdown editor"
authors = ["Markpion contributors"]
edition = "2021"
rust-version = "1.83"

[lib]
name = "markpion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
trash = "5"
base64 = "0.22"
regex = "1"
notify-debouncer-mini = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
